name: Orbit
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '26.0'
    macOS: '15.0'
packages:
  Orbit:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    'EXCLUDED_ARCHS[sdk=iphonesimulator*]': x86_64
configFiles:
  Debug: Config/Orbit.xcconfig
  Release: Config/Orbit.xcconfig
targets:
  Orbit:
    type: application
    platform: iOS
    sources: [Apps/Orbit]
    info:
      path: Apps/Orbit/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Orbit connects to your Mac to edit files and build apps.
        OrbitWidgetKeychainGroup: $(AppIdentifierPrefix)$(ORBIT_IOS_BUNDLE_IDENTIFIER)
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).remote-build
          - $(PRODUCT_BUNDLE_IDENTIFIER).overnight-builds
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh-builds
          - $(PRODUCT_BUNDLE_IDENTIFIER).applet-poll
        UIBackgroundModes: [processing, fetch]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Orbit JavaScript
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.netscape.javascript-source, public.plain-text]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ORBIT_IOS_BUNDLE_IDENTIFIER)
        CODE_SIGN_ENTITLEMENTS: Apps/Orbit/Orbit.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
    preBuildScripts:
      - name: Validate local Orbit identity
        script: 'python3 "$SRCROOT/scripts/local_identity.py"'
        basedOnDependencyAnalysis: false
    dependencies:
      - target: OrbitShareExtension
      - target: OrbitWidgetExtension
      - package: Orbit
        product: OrbitWidgetUI
      - package: Orbit
        product: OrbitRefresh
      - package: Orbit
        product: OrbitUI
      - package: Orbit
        product: OrbitTransport
  OrbitShareExtension:
    type: app-extension
    platform: iOS
    sources: [Apps/OrbitShare]
    info:
      path: Apps/OrbitShare/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OrbitWidgetKeychainGroup: $(AppIdentifierPrefix)$(ORBIT_IOS_BUNDLE_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).OrbitShareController
          NSExtensionAttributes:
            NSExtensionActivationRule: 'SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.netscape.javascript-source" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url").@count == 1).@count == 1'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ORBIT_IOS_BUNDLE_IDENTIFIER).share
        CODE_SIGN_ENTITLEMENTS: Apps/OrbitShare/OrbitShare.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: Orbit
        product: OrbitWidgets
  OrbitWidgetExtension:
    type: app-extension
    platform: iOS
    sources: [Apps/OrbitWidgets]
    info:
      path: Apps/OrbitWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OrbitWidgetKeychainGroup: $(AppIdentifierPrefix)$(ORBIT_IOS_BUNDLE_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ORBIT_IOS_BUNDLE_IDENTIFIER).widgets
        CODE_SIGN_ENTITLEMENTS: Apps/OrbitWidgets/OrbitWidgets.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: Orbit
        product: OrbitWidgetUI
      - package: Orbit
        product: OrbitWidgets
  OrbitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apps/OrbitUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ORBIT_BUNDLE_PREFIX).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Orbit
    dependencies:
      - target: Orbit
  OrbitMonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Apps/OrbitMonitorTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ORBIT_BUNDLE_PREFIX).monitor-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Orbit.app/Orbit
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Orbit
      - package: Orbit
        product: OrbitUI
  OrbitMacClient:
    type: application
    platform: macOS
    sources: [Sources/OrbitMacApp, Apps/OrbitMac/Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ORBIT_BUNDLE_PREFIX).mac
        PRODUCT_NAME: OrbitMacClient
        PRODUCT_MODULE_NAME: OrbitMacClient
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Orbit Mac
        INFOPLIST_KEY_OrbitPhoneBundleIdentifier: $(ORBIT_IOS_BUNDLE_IDENTIFIER)
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Orbit connects to your phone to build and install your apps.
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Validate local Orbit identity
        script: 'python3 "$SRCROOT/scripts/local_identity.py"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle Apple installation and pairing helper
        script: '"$SRCROOT/scripts/build_apple_adapter.sh" --xcode'
        basedOnDependencyAnalysis: false
    dependencies:
      - package: Orbit
        product: OrbitHost
  # A native product lets Xcode resolve the installed executable for Run/debugging.
  # The shared installer owns every byte of the signed bundle.
  OrbitMacInstall:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ORBIT_BUNDLE_PREFIX).mac
        EXECUTABLE_NAME: OrbitMacApp
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build and install canonical Orbit Mac
        script: |
          set -eu
          "$SRCROOT/scripts/build_and_run.sh" --install-only
          python3 "$SRCROOT/scripts/xcode_mac_product.py" "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        basedOnDependencyAnalysis: false
schemes:
  Orbit:
    build:
      targets:
        Orbit: all
    test:
      targets: [OrbitMonitorTests, OrbitUITests]
  OrbitMac:
    build:
      targets:
        OrbitMacInstall: all
  OrbitMacBuild:
    build:
      targets:
        OrbitMacClient: all
